name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    env:
      CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: 'https://services.gradle.org/distributions/gradle-8.7-bin.zip'
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "platforms;android-34" "platforms;android-35" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Install Root Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build -- --outDir src-cordova/www

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Android Debug APK
        working-directory: src-cordova
        run: |
          npm install
          cordova platform remove android --nosave || true
          cordova platform add android@12.0.1 --save
          cordova build android --debug

      - name: Build Android Release Bundle (.aab)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: src-cordova
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat <<EOF > build.json
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": ""
              }
            }
          }
          EOF
          cordova build android --release -- --packageType=bundle

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7secs-sound-app-debug-apk
          path: src-cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release AAB Artifact (Play Store)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: 7secs-sound-app-release-aab
          path: src-cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
