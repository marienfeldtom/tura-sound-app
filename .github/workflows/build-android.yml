name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build -- --outDir src-cordova/www

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android APK
        working-directory: src-cordova
        run: |
          npm install
          cordova platform add android@12.0.1 --save || cordova prepare android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7secs-sound-app-debug-apk
          path: src-cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
